<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrackEditor</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-display">
    <div class="nav-menu">
        <div class="logo">
            <h1>Car Track Builder</h1>
            <p>Mityska</p>
        </div>
        <div class="buttons">
            <div class="buttons" id="start-buttons">
                <a href="#" class="menuButton" id="btnNewMap">Nová mapa</a>
                <a href="#" class="menuButton" id="btnLoad">Načíst mapu</a>
            </div>
            <div class="buttons hidden" id="edit-buttons">
                <a href="#" class="menuButton" id="btnSave">Uložit</a>
                <a href="#" class="menuButton" id="btnReset">Reset</a>
                <a href="#" class="menuButton" id="btnBack">Zpět</a>
            </div>
        </div>
        <div id="loadModal" class="modal hidden">
            <div class="modal-content">
                <h2>Vyberte mapu</h2>
                <div id="maps-list"></div>
                <button id="closeModal" >Zrušit</button>
            </div>
        </div>
        <div id="saveModal" class="modal hidden">
            <div class="modal-content">
                <h2>Zvolte název mapy</h2>
                <input id="name-input" type="text" placeholder="Název mapy...">
                <button id="closeSaveModal" >Zrušit</button>
                <button id="saveSaveModal" >Uložit</button>
            </div>
        </div>
    </div>
    <div class="center">
        <div id="main-grid" class="hidden">

        </div>
    </div>

</div>

<template>
    <div class="node-unit node-grass" data-index></div>
</template>

<script src="script.js"></script>
</body>
</html>
